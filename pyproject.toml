[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-llm-benchmark"
version = "0.1.0"
description = "Resource-Aware Benchmarking of Local LLMs on Apple Silicon for Offline AI and RAG Applications"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Research Team"}
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.2.0",
    "streamlit>=1.25.0",
    "pytest>=7.0.0",
    "huggingface-hub>=0.16.0",
    "rouge-score>=0.1.2",
    "psutil>=5.9.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
llama = ["llama-cpp-python>=0.2.0"]
vector = ["faiss-cpu>=1.7.4"]
dev = ["pytest>=7.0.0", "black", "isort"]

[project.scripts]
benchmark = "benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    "src"
]
